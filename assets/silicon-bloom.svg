<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#34201f"/>
      <stop offset=".42" stop-color="#16110f"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="petal-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb8ae"/>
      <stop offset=".25" stop-color="#fe684f"/>
      <stop offset=".53" stop-color="#9f182c"/>
      <stop offset=".78" stop-color="#35172c"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="petal-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e3df"/>
      <stop offset=".3" stop-color="#e98c86"/>
      <stop offset=".66" stop-color="#9b5162"/>
      <stop offset="1" stop-color="#19161d"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#b9a9bc"/>
      <stop offset=".4" stop-color="#3a3146"/>
      <stop offset=".62" stop-color="#f2dfe5"/>
      <stop offset=".82" stop-color="#655566"/>
      <stop offset="1" stop-color="#f7f2eb"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency=".9" numOctaves="3" seed="18" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .22"/>
      </feComponentTransfer>
    </filter>
    <pattern id="lines" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="2000" fill="url(#bg)"/>
  <ellipse cx="820" cy="920" rx="590" ry="520" fill="#d93d42" opacity=".32" filter="url(#glow)"/>
  <g transform="translate(800 930)">
    <g fill="url(#petal-a)" stroke="#ffc3b5" stroke-opacity=".22" stroke-width="3" filter="url(#soft)">
      <ellipse rx="185" ry="620" transform="rotate(0)"/>
      <ellipse rx="185" ry="620" transform="rotate(30)"/>
      <ellipse rx="185" ry="620" transform="rotate(60)"/>
      <ellipse rx="185" ry="620" transform="rotate(90)"/>
      <ellipse rx="185" ry="620" transform="rotate(120)"/>
      <ellipse rx="185" ry="620" transform="rotate(150)"/>
    </g>
    <g fill="url(#petal-b)" stroke="#fff" stroke-opacity=".2" stroke-width="2">
      <ellipse rx="105" ry="425" transform="rotate(18)"/>
      <ellipse rx="105" ry="425" transform="rotate(78)"/>
      <ellipse rx="105" ry="425" transform="rotate(138)"/>
    </g>
    <circle r="215" fill="#09090d"/>
    <circle r="198" fill="url(#chrome)"/>
    <ellipse cx="-64" cy="-72" rx="72" ry="45" fill="#fff" opacity=".72" filter="url(#soft)" transform="rotate(-28 -64 -72)"/>
    <circle r="46" fill="#050508" opacity=".7"/>
    <circle r="18" cx="-12" cy="-13" fill="#fff" opacity=".9"/>
  </g>
  <path d="M-120 1540C350 1280 740 1670 1120 1380S1670 1420 1770 1060" fill="none" stroke="#f8b7aa" stroke-opacity=".35" stroke-width="3"/>
  <path d="M-140 1570C350 1310 745 1700 1125 1410S1670 1450 1780 1090" fill="none" stroke="#fc6d5b" stroke-opacity=".18" stroke-width="18" filter="url(#soft)"/>
  <path d="M220 440C420 300 610 350 700 500" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  <path d="M1130 1230C1300 1150 1430 1200 1510 1360" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <rect width="1600" height="2000" fill="url(#lines)"/>
  <rect width="1600" height="2000" filter="url(#grain)" opacity=".35"/>
</svg>
